services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./config.yml:/etc/docker/registry/config.yml:ro
      - ./certs:/certs:ro
      - ./auth:/auth:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:5000/"]
      interval: 15s
      timeout: 3s
      retries: 5

  mirror:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - mirror-data:/var/lib/registry
      - ./mirror-config.yml:/etc/docker/registry/config.yml:ro

  ui:
    image: joxit/docker-registry-ui:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: Shop SAS Registry
      DELETE_IMAGES: "true"
      NGINX_PROXY_PASS_URL: https://registry:5000
      REGISTRY_SECURED: "true"
    depends_on:
      - registry

volumes:
  registry-data:
  mirror-data:
