global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
