name: shop

x-healthcheck-defaults: &hc
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  REDIS_URL: redis://redis:6379

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [front]
    healthcheck:
      <<: *hc
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    logging: *logging
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [back]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [back]
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]
    logging: *logging
    restart: unless-stopped

  api:
    build:
      context: ./apps/shopapi
    image: shop-api:local
    environment:
      <<: *app-env
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [db_password]
    command:
      - sh
      - -c
      - export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" && exec node src/server.js
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [front, back]
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=shop_front
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
    logging: *logging
    restart: unless-stopped

  worker:
    build:
      context: ./apps/shop-worker
      secrets: [pipconf]
    image: shop-worker:local
    environment:
      <<: *app-env
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
    secrets: [db_password]
    command:
      - sh
      - -c
      - export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" && exec python -m worker.main
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [back]
    healthcheck:
      <<: *hc
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
    logging: *logging
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    networks: [front, back]
    healthcheck:
      <<: *hc
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=shop_front
      - traefik.http.routers.adminer.rule=Host(`adminer.localhost`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.services.adminer.loadbalancer.server.port=8080
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  migrate:
    image: postgres:16.4-alpine
    profiles: [ops]
    environment:
      MIGRATION: ${MIGRATION:-}
    secrets: [db_password]
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - test -n "$$MIGRATION" && PGPASSWORD="$$(cat /run/secrets/db_password)" exec psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$$MIGRATION"
    depends_on:
      db:
        condition: service_healthy
    networks: [back]
    restart: "no"

networks:
  front:
  back:
    internal: true

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ./apps/shop-worker/pip.conf
