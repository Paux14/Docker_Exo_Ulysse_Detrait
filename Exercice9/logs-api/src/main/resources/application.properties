spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/logsdb}
spring.datasource.username=${DB_USER:dogs}
spring.datasource.password=${DB_PASSWORD:dogspass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Les dates sont renvoyées en chaîne ISO-8601 et non en nombre
spring.jackson.serialization.write-dates-as-timestamps=false
