services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Méthode 1 : valeur lue dans le fichier .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volume nommé : les données PostgreSQL survivent à la suppression du conteneur
      - pg_data:/var/lib/postgresql/data
      # Scripts SQL exécutés uniquement à la première initialisation (base vide)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # l'application démarre quand PostgreSQL est prêt
    environment:
      # Méthode 1 : depuis le fichier .env
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      # Méthode 2 : valeur en dur (non modifiable via .env)
      APP_ENV: production
      DB_HOST: db            # nom du service, résolu par le DNS interne de Docker
      DB_PORT: "5432"
      UPLOAD_PATH: /app/uploads
      # Méthode 3 : avec valeur par défaut si la variable est absente du .env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOW_SQL: ${SHOW_SQL:-false}
    ports:
      - "8080:8080"
    volumes:
      # Volume nommé : les fichiers uploadés survivent à la suppression du conteneur
      - uploads:/app/uploads

volumes:
  pg_data:
  uploads:
