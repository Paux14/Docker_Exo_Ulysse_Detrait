# Les valeurs peuvent être surchargées par des variables d'environnement (utilisées dans compose.yaml).
# Par défaut : API lancée en local, base MySQL accessible via le port forwarding sur localhost:3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dogsdb}
spring.datasource.username=${DB_USER:dogs}
spring.datasource.password=${DB_PASSWORD:dogspass}

# Hibernate crée / met à jour la table "dogs" à partir de l'entité
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
